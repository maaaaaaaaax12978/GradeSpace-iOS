name: Build iPhone IPA

on:
  workflow_dispatch:
  push:
    branches: [main, codex/native-ios]
    paths:
      - GradeSpace/**
      - GradeSpaceTests/**
      - GradeSpaceUITests/**
      - Package.swift
      - project.yml
      - .github/workflows/build-ios.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Download project
        uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Generate native Xcode project
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate
      - name: Test native calculations, migration, and persistence
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          swift test 2>&1 | tee tests.log
      - name: Build for a real iPhone
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project GradeSpace.xcodeproj \
            -scheme GradeSpace \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build 2>&1 | tee build.log
      - name: Package unsigned native IPA
        shell: bash
        run: |
          set -euo pipefail
          APP=build/Build/Products/Release-iphoneos/GradeSpace.app
          test -f "$APP/GradeSpace"
          test ! -d "$APP/Web"
          mkdir -p package/Payload
          cp -R "$APP" package/Payload/
          cd package
          zip -r -q ../Ball-2.1.ipa Payload
      - name: Download your IPA here
        uses: actions/upload-artifact@v4
        with:
          name: Ball-IPA
          path: Ball-2.1.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Save test results and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GradeSpace-validation
          path: |
            tests.log
            build.log
          if-no-files-found: ignore
          retention-days: 7


  ui-check:
    runs-on: macos-26
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen generate
      - name: Run native UI flow
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if "iPhone" in x["name"]))')
          xcodebuild test -project GradeSpace.xcodeproj -scheme GradeSpace \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -only-testing:GradeSpaceUITests -parallel-testing-enabled NO \
            -resultBundlePath UIResults.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee ui.log
      - name: Export native screenshots
        if: always()
        run: |
          if [ -d UIResults.xcresult ]; then
            xcrun xcresulttool export attachments --path UIResults.xcresult --output-path screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Ball-UI-check
          path: |
            ui.log
            screenshots
          if-no-files-found: ignore
          retention-days: 7
