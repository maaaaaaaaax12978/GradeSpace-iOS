name: Package native iPhone IPA

on:
  workflow_dispatch:
  push:
    branches: [codex/native-ios]
    paths:
      - GradeSpace/Native/**
      - project.yml
      - .github/workflows/native-ipa.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        run: |
          xcodebuild -version
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen generate
      - name: Compile native iPhone application
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project GradeSpace.xcodeproj -scheme GradeSpace \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' build 2>&1 | tee build.log
      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail
          APP=build/Build/Products/Release-iphoneos/GradeSpace.app
          test -f "$APP/GradeSpace"
          test ! -d "$APP/Web"
          mkdir -p package/Payload
          cp -R "$APP" package/Payload/
          cd package
          zip -r -q ../GradeSpace-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: GradeSpace-Native-IPA
          path: GradeSpace-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Native-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
