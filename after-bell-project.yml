name: AfterBell
options:
  bundleIdPrefix: app.afterbell
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    TARGETED_DEVICE_FAMILY: "1"
targets:
  AfterBell:
    type: application
    platform: iOS
    sources:
      - path: AfterBell
        excludes:
          - Web
      - path: AfterBell/Web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.afterbell.planner
        PRODUCT_NAME: AfterBell
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: AfterBell/Info.plist
      properties:
        CFBundleDisplayName: После звонка
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
schemes:
  AfterBell:
    build:
      targets:
        AfterBell: all
