name: GradeSpace
options:
  bundleIdPrefix: app.gradespace
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  GradeSpace:
    type: application
    platform: iOS
    sources:
      - path: GradeSpace/Native
      - path: GradeSpace/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.gradespace.personal
        PRODUCT_NAME: GradeSpace
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        SUPPORTS_MACCATALYST: NO
    info:
      path: GradeSpace/Info.plist
      properties:
        CFBundleDisplayName: GradeSpace
        CFBundleShortVersionString: "2.0"
        CFBundleVersion: "3"
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
  GradeSpaceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GradeSpaceTests
    dependencies:
      - target: GradeSpace
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  GradeSpace:
    build:
      targets:
        GradeSpace: all
        GradeSpaceTests: [test]
    test:
      targets:
        - GradeSpaceTests
      gatherCoverageData: false
